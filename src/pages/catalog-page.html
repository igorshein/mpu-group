<!DOCTYPE html>

<html lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><title>{{TITLE}}</title>
<meta content="{{DESCRIPTION}}" name="description"/>
<meta content="{{OG_TITLE}}" property="og:title"/>
<meta content="{{OG_DESCRIPTION}}" property="og:description"/>
<meta content="website" property="og:type"/>
<meta content="ru_RU" property="og:locale"/>
<meta content="{{CANONICAL}}" property="og:url"/>
<meta content="/assets/img/og-image.jpg" property="og:image"/>
<meta content="summary_large_image" name="twitter:card"/>
{{ROBOTS}}
<link href="{{CANONICAL}}" rel="canonical"/>
{{JSONLD}}
<meta content="#e31e24" name="theme-color"/>
<link href="/favicon.svg" rel="icon" type="image/svg+xml"/>
<link href="/assets/img/favicon-192.png" rel="apple-touch-icon"/>
<link href="/assets/img/favicon-192.png" rel="icon" type="image/png" sizes="192x192"/>
<link href="/assets/img/favicon-512.png" rel="icon" type="image/png" sizes="512x512"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="/assets/css/site.css" rel="stylesheet"/>
<link as="font" crossorigin href="/assets/fonts/material-symbols-outlined.woff2" rel="preload" type="font/woff2"/>
<link as="font" crossorigin href="/assets/fonts/manrope-latin.woff2" rel="preload" type="font/woff2"/>
<link as="font" crossorigin href="/assets/fonts/montserrat-latin.woff2" rel="preload" type="font/woff2"/>
</head><body class="bg-surface font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">{{HEADER}}<main class="pb-16 lg:pb-24">

<!-- Хлебные крошки: видимый список (используется и в JSON-LD BreadcrumbList) -->
<nav aria-label="Хлебные крошки" class="bg-surface-container-lowest border-b border-surface-container">
<ol class="max-w-5xl mx-auto px-6 lg:px-12 py-3.5 flex flex-wrap items-center gap-x-2 gap-y-1 font-label-caps text-label-caps uppercase tracking-wider text-secondary">
<li class="flex items-center gap-2"><a class="hover:text-primary-container transition-colors" href="/">Главная</a><span class="text-surface-dim" aria-hidden="true">/</span></li>
<li class="flex items-center gap-2"><a class="hover:text-primary-container transition-colors" href="/katalog/">Каталог</a><span class="text-surface-dim" aria-hidden="true">/</span></li>
<li aria-current="page" class="text-on-surface">{{NAME}}<span class="ml-1.5 text-surface-dim">/ {{NUM}}</span></li>
</ol>
</nav>

<!-- HERO: фото, бейджи категории -->
<div id="catalog-hero" class="relative h-64 sm:h-80 lg:h-96 w-full overflow-hidden bg-surface-container">
<img alt="{{IMG_ALT}}" class="w-full h-full object-cover" decoding="async" height="436" loading="eager" sizes="(max-width: 767px) 100vw, 64rem" src="{{IMG_SRC_ROOT}}" srcset="{{IMG_SRCSET_ROOT}}" width="1200"/>
<div class="absolute inset-0 bg-gradient-to-t from-inverse-surface/85 via-transparent to-transparent"></div>
<div class="absolute top-5 left-5 bg-primary-container text-on-primary-container px-3 py-1 font-label-caps text-label-caps uppercase">{{EYEBROW}}</div>
<div class="absolute bottom-5 left-5 bg-inverse-surface text-on-primary-container px-2.5 py-0.5 font-label-caps text-label-caps uppercase" data-catalog-badge="{{NUM}}">{{BADGE}}</div>
</div>

<!-- Контент категории -->
<div id="catalog-content" class="max-w-5xl mx-auto px-6 lg:px-12">
<div class="py-8 lg:py-12">
<h1 class="font-headline-xl text-headline-xl-mobile sm:text-headline-xl hyphens-auto sm:hyphens-none uppercase text-on-surface">{{H1}}</h1>
<p class="font-body-md lg:text-body-lg text-body-md text-secondary leading-relaxed mt-4">{{INTRO}}</p>
<div class="mt-8 pt-6 border-t border-surface-container">
{{BODY}}
</div>

<!-- CTA -->
<div class="mt-8 bg-surface-container-low p-5 sm:p-6 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
<p class="font-body-sm text-body-sm text-secondary leading-relaxed">{{CTA}}</p>
<a class="shrink-0 bg-primary-container hover:bg-primary text-on-primary-container font-label-caps text-label-caps uppercase tracking-wider px-5 py-3 leading-tight transition-colors flex items-center justify-center gap-2" href="/#express-request">
<span>Оставить заявку на КП</span>
<span class="material-symbols-outlined text-base">arrow_forward</span>
</a>
</div>

<!-- Навигация между категориями -->
<div class="mt-10 pt-6 border-t border-surface-container grid grid-cols-1 sm:grid-cols-2 gap-4">
<div>
{{PREV_LINK}}
</div>
<div>
{{NEXT_LINK}}
</div>
</div>
</div>
</div>
</main>{{FOOTER}}<script src="/assets/js/site.js" defer></script></body></html>
